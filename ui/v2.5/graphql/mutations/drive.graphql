mutation AddDriveSource($input: AddDriveSourceInput!) {
  addDriveSource(input: $input) {
    id
    name
    drive_id
    root_folder_id
    keys_path
    scope
    cache_dir
    file_count
    mounted
  }
}

mutation RemoveDriveSource($id: String!) {
  removeDriveSource(id: $id)
}

mutation SyncDriveSource($id: String!) {
  syncDriveSource(id: $id)
}

mutation SetDriveSourceFastScan($id: String!, $fastScan: Boolean!) {
  setDriveSourceFastScan(id: $id, fast_scan: $fastScan)
}

mutation SetGoogleOAuthClient($input: SetGoogleOAuthClientInput!) {
  setGoogleOAuthClient(input: $input)
}

mutation DisconnectGoogleDrive($clearClient: Boolean) {
  disconnectGoogleDrive(clear_client: $clearClient)
}

mutation MigrateDriveByPath($input: MigrateDriveByPathInput!) {
  migrateDriveByPath(input: $input) {
    candidates
    migrated
    not_in_db
    size_mismatch
    collision
    dry_run
  }
}
