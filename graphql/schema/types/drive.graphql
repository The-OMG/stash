"A native Google Drive source: a shared drive scanned directly via the Drive API."
type DriveSource {
  "stable identifier, used in the virtual library path"
  id: String!
  "display name"
  name: String!
  "shared (team) drive id"
  drive_id: String!
  "optional folder id to scope the source to (empty = whole drive)"
  root_folder_id: String
  "service-account json file or directory"
  keys_path: String!
  "oauth scope (empty = full drive)"
  scope: String
  "media cache directory (empty = default under cache path)"
  cache_dir: String
  "number of files currently indexed"
  file_count: Int!
  "whether the source is mounted and ready"
  mounted: Boolean!
  "virtual library path the source is mounted at (selectable for scans)"
  path: String!
}

"A Google Drive folder, for the source picker."
type DriveFolder {
  id: String!
  name: String!
}

"Connection status of the in-app Google OAuth account."
type GoogleAuthStatus {
  "an account is connected (has a refresh token)"
  connected: Boolean!
  "an OAuth client (built-in or per-instance) is configured"
  client_configured: Boolean!
}

"A drive selectable as a source via the connected Google account."
type GoogleDrive {
  "shared drive id; empty for My Drive"
  id: String!
  name: String!
  my_drive: Boolean!
}

input SetGoogleOAuthClientInput {
  client_id: String!
  client_secret: String!
}

input MigrateDriveByPathInput {
  "existing library path prefix to migrate from (e.g. /home/theomg/cloud)"
  prefix: String!
  "target Drive source id"
  drive_id: String!
  "require the DB file size to match the drive (recommended)"
  require_size: Boolean
  "preview only — make no changes"
  dry_run: Boolean
}

"Status/result of the most recent path-based Drive migration (poll while running)."
type MigrateDriveStatus {
  running: Boolean!
  drive_id: String
  dry_run: Boolean!
  candidates: Int!
  migrated: Int!
  not_in_db: Int!
  size_mismatch: Int!
  collision: Int!
  "RFC3339 finish time, null if running/never run"
  finished_at: String
}

"Result of a path-based Drive migration."
type MigrateDriveResult {
  "files in the drive index that were considered"
  candidates: Int!
  "existing DB files repointed to the drive"
  migrated: Int!
  "on the drive but not yet in the DB (a scan would add these)"
  not_in_db: Int!
  "DB file at the path but a different size (skipped)"
  size_mismatch: Int!
  "a file already exists at the drive path (skipped)"
  collision: Int!
  dry_run: Boolean!
}

input DriveBrowseInput {
  "drive to browse (optional if rclone_remote provides a team_drive)"
  drive_id: String
  "parent folder id to list; empty = the drive/source root"
  parent_id: String
  keys_path: String
  scope: String
  auth_type: String
  client_id: String
  client_secret: String
  token: String
  rclone_remote: String
}

input AddDriveSourceInput {
  id: String!
  name: String!
  "shared drive id (optional if importing an rclone remote that has a team_drive)"
  drive_id: String
  root_folder_id: String
  "service-account json file or directory (for SA auth)"
  keys_path: String
  scope: String
  cache_dir: String
  cache_bytes: Int64
  "auth type: 'sa' (default) or 'oauth'"
  auth_type: String
  "oauth client id/secret (optional; rclone defaults used if empty)"
  client_id: String
  client_secret: String
  "oauth token JSON (rclone format)"
  token: String
  "import token + ids from this rclone remote name"
  rclone_remote: String
  "fast scan: use Drive duration/dimensions and skip ffprobe (no codec detail)"
  fast_scan: Boolean
}
