query DriveSources {
  driveSources {
    id
    name
    drive_id
    root_folder_id
    keys_path
    scope
    cache_dir
    file_count
    mounted
    path
    fast_scan
  }
}

query RcloneRemotes {
  rcloneRemotes
}

query GoogleAuthStatus {
  googleAuthStatus {
    connected
    client_configured
  }
}

query GoogleDrives {
  googleDrives {
    id
    name
    my_drive
  }
}

query DriveBrowse($input: DriveBrowseInput!) {
  driveBrowse(input: $input) {
    id
    name
  }
}

query DriveMigrateStatus {
  driveMigrateStatus {
    running
    drive_id
    dry_run
    candidates
    migrated
    not_in_db
    size_mismatch
    collision
    finished_at
  }
}
